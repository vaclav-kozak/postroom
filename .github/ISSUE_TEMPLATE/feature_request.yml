name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Postroom behave? Tool names, parameters or UI, if you have ideas.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: >-
        Postroom holds the keys to every mailbox of its owner. Does this change what an MCP
        client can do (e.g. send, delete, modify) or what is stored? How would it stay safe?
