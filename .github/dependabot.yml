version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # The Python version is chosen deliberately (.python-version, requires-python);
      # moving to a new minor Python is a manual change, not a bot bump.
      - dependency-name: python
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      python-minor-patch:
        update-types: [minor, patch]
