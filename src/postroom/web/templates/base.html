<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Postroom{% endblock %}</title>
<link rel="icon" href="/static/favicon.svg?v={{ asset_v }}" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
<script src="/static/app.js?v={{ asset_v }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
<div class="airmail" aria-hidden="true"></div>
<header class="masthead">
  <div class="wrap masthead-inner">
    <a class="brand" href="/admin">{% include "partials/stamp.html" %}<span class="brand-name">Postroom</span></a>
    {% if owner %}
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="btn btn-quiet">Log out</button>
    </form>
    {% endif %}
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
</body>
</html>
